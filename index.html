<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源导航</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="tsparticles" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="#" id="brand">
        <span class="logo">导</span>
        <span class="brand-text">
          <strong>资源导航</strong>
          <small>常用站点，点一下就走</small>
        </span>
      </a>

      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5 L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="q" type="search" placeholder="搜索全部站点…（按 / 聚焦）" autocomplete="off">
        </label>

        <button id="themeBtn" class="theme-btn" type="button" aria-label="切换明暗模式" title="切换明暗">
          <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="foot wrap">
    <p><span id="total"></span> 个站点 · 点击在新标签页打开</p>
    <p class="mini">加站点改 <code>data.js</code></p>
  </footer>

  <script src="data.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>
  <script src="particles.js"></script>
</body>
</html>
